name: Deploy Cloudflare

on:
  push:
    branches: ['**']
  workflow_dispatch:

permissions:
  contents: read
  actions: read

# Keep in-flight migrations/deployments intact. Change detection uses the last
# successful run, so coalesced pending pushes do not lose package changes.
concurrency:
  group: cloudflare-${{ github.ref }}
  cancel-in-progress: false

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      agents: ${{ steps.changes.outputs.agents }}
      api: ${{ steps.changes.outputs.api }}
      web: ${{ steps.changes.outputs.web }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - id: changes
        run: node scripts/ci/changes.mjs
        env:
          GH_TOKEN: ${{ github.token }}
      - run: node --test scripts/ci/*.test.mjs

  agents:
    needs: [changes]
    if: needs.changes.outputs.agents == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @weave/agents typecheck
      - name: Deploy agents
        run: node scripts/ci/deploy.mjs agents
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}

  api:
    needs: [changes, agents]
    if: always() && needs.changes.result == 'success' && needs.changes.outputs.api == 'true' && (needs.agents.result == 'success' || needs.agents.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @weave/api typecheck
      - name: Deploy api
        run: node scripts/ci/deploy.mjs api
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET }}

  web:
    needs: [changes, agents, api]
    if: always() && needs.changes.result == 'success' && needs.changes.outputs.web == 'true' && (needs.agents.result == 'success' || needs.agents.result == 'skipped') && (needs.api.result == 'success' || needs.api.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @weave/web typecheck
      - name: Deploy web
        run: node scripts/ci/deploy.mjs web
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
