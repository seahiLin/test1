name: Deploy Cloudflare

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

# The cleanup workflow uses the same PR group so it cannot race a deployment.
concurrency:
  group: cloudflare-${{ github.event.pull_request.number && format('pr-{0}', github.event.pull_request.number) || 'main' }}
  cancel-in-progress: false

jobs:
  changes:
    if: >-
      (github.event_name != 'pull_request' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'pull_request' && !github.event.pull_request.draft &&
       github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-24.04
    outputs:
      agents: ${{ steps.changes.outputs.agents }}
      api: ${{ steps.changes.outputs.api }}
      web: ${{ steps.changes.outputs.web }}
      matrix: ${{ steps.changes.outputs.matrix }}
      any: ${{ steps.changes.outputs.any }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .node-version
      - run: node --test scripts/ci/*.test.mjs
      - id: changes
        run: node scripts/ci/changes.mjs
        env:
          GH_TOKEN: ${{ github.token }}

  build:
    needs: changes
    if: needs.changes.outputs.any == 'true'
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        package: ${{ fromJSON(needs.changes.outputs.matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @weave/${{ matrix.package }} typecheck
      - run: pnpm --filter @weave/${{ matrix.package }} build
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: bundle-${{ matrix.package }}
          path: apps/${{ matrix.package }}/dist/
          if-no-files-found: error
          retention-days: 7

  preview:
    needs: [changes, build]
    if: github.event_name == 'pull_request'
    uses: ./.github/workflows/deploy-environment.yml
    with:
      target: pr-${{ github.event.pull_request.number }}
      environment: preview
      agents: ${{ needs.changes.outputs.agents == 'true' }}
      api: ${{ needs.changes.outputs.api == 'true' }}
      web: ${{ needs.changes.outputs.web == 'true' }}
    secrets: inherit

  staging:
    needs: [changes, build]
    if: github.event_name != 'pull_request'
    uses: ./.github/workflows/deploy-environment.yml
    with:
      target: staging
      environment: staging
      agents: ${{ needs.changes.outputs.agents == 'true' }}
      api: ${{ needs.changes.outputs.api == 'true' }}
      web: ${{ needs.changes.outputs.web == 'true' }}
    secrets: inherit

  production:
    needs: [changes, staging]
    if: github.event_name != 'pull_request'
    uses: ./.github/workflows/deploy-environment.yml
    with:
      target: production
      environment: production
      agents: ${{ needs.changes.outputs.agents == 'true' }}
      api: ${{ needs.changes.outputs.api == 'true' }}
      web: ${{ needs.changes.outputs.web == 'true' }}
    secrets: inherit
